<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Crear cuenta — Mensajería Anónima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="center-shell">
  <div class="auth-card">
    <div class="brand" style="justify-content:center; width:100%; margin-bottom: 22px;">
      <span class="brand-mark">MA</span>Mensajería Anónima
    </div>
    <h2 style="text-align:center; margin-bottom:4px;">Crea tu cuenta</h2>
    <p style="text-align:center; margin-bottom:24px;" id="register-subtitle">Obtén tu enlace personal en segundos.</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="full_name">Nombre completo</label>
        <input type="text" id="full_name" autocomplete="name" placeholder="Juan Pérez" required />
        <div class="field-error" id="error-full_name"></div>
      </div>
      <div class="field">
        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" autocomplete="username" placeholder="juan123" required />
        <div class="field-hint">Tu enlace será mensajeriaanonima.app/u/tuusuario</div>
        <div class="field-error" id="error-username"></div>
      </div>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" autocomplete="email" placeholder="tu@correo.com" required />
        <div class="field-error" id="error-email"></div>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required />
        <div class="field-error" id="error-password"></div>
      </div>
      <button type="submit" class="btn btn-primary" id="register-submit">Crear cuenta</button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:14px;">
      ¿Ya tienes cuenta? <a href="/login.html">Iniciar sesión</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.getElementById("register-form").addEventListener("submit", handleRegister);

  // Si venimos de un intento de enviar mensaje sin sesión, lo indicamos.
  const pending = sessionStorage.getItem("mensajea_pending_profile");
  if (pending) {
    document.getElementById("register-subtitle").textContent =
      `Crea tu cuenta para enviarle un mensaje a @${pending}.`;
  }
</script>
</body>
</html>
