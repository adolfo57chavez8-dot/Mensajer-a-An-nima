<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Iniciar sesión — Mensajería Anónima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="center-shell">
  <div class="auth-card">
    <div class="brand" style="justify-content:center; width:100%; margin-bottom: 22px;">
      <span class="brand-mark">MA</span>Mensajería Anónima
    </div>
    <h2 style="text-align:center; margin-bottom:4px;">Bienvenido de nuevo</h2>
    <p style="text-align:center; margin-bottom:24px;">Inicia sesión para revisar tus mensajes.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" autocomplete="email" placeholder="tu@correo.com" required />
        <div class="field-error" id="error-email"></div>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="********" required />
        <div class="field-error" id="error-password"></div>
      </div>
      <div style="text-align:right; margin-bottom:20px;">
        <a href="/forgot-password.html" style="font-size:13px;">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit" class="btn btn-primary" id="login-submit">Iniciar sesión</button>
    </form>

    <p style="text-align:center; margin-top:20px; font-size:14px;">
      ¿No tienes cuenta? <a href="/register.html">Crear cuenta</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", handleLogin);
</script>
</body>
</html>
