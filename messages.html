<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mensajes — Mensajería Anónima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div id="loading" class="full-loading"><div class="loading-spinner"></div></div>

<div class="app-shell" id="content" style="display:none;">
  <div class="topbar">
    <h2 style="margin:0;">Mensajes</h2>
  </div>
  <div id="messages-list"></div>
</div>

<!-- Modal de mensaje individual -->
<div class="modal-overlay" id="message-modal">
  <div class="modal">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">
      <div class="avatar" id="modal-avatar"></div>
      <div>
        <div style="font-weight:700;" id="modal-username">@usuario</div>
        <div style="font-size:12px; color:var(--text-faint);" id="modal-time">Hace 5 minutos</div>
      </div>
    </div>
    <p id="modal-content" style="color:var(--text); font-size:15px; line-height:1.6;"></p>
    <div class="divider"></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-ghost btn-sm" id="modal-delete-btn">Eliminar</button>
      <button class="btn btn-ghost btn-sm" id="modal-block-btn">Bloquear usuario</button>
      <button class="btn btn-ghost btn-sm" id="modal-report-btn">Reportar</button>
      <button class="btn btn-secondary btn-sm" id="modal-close-btn" style="margin-left:auto;">Cerrar</button>
    </div>
  </div>
</div>

<!-- Modal de reporte -->
<div class="modal-overlay" id="report-modal">
  <div class="modal">
    <h3>Reportar mensaje</h3>
    <p>Cuéntanos qué ocurre con este mensaje.</p>
    <div class="field">
      <label for="report-reason">Motivo</label>
      <select id="report-reason" style="width:100%; padding:13px 14px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px; color:var(--text);">
        <option value="acoso">Acoso</option>
        <option value="spam">Spam</option>
        <option value="contenido_inapropiado">Contenido inapropiado</option>
        <option value="otro">Otro</option>
      </select>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-ghost" id="report-cancel-btn">Cancelar</button>
      <button class="btn btn-primary" id="report-submit-btn">Enviar reporte</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/messages.js"></script>
</body>
</html>
