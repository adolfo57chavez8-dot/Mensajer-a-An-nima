<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Recuperar contraseña — Mensajería Anónima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="center-shell">
  <div class="auth-card">
    <div class="brand" style="justify-content:center; width:100%; margin-bottom: 22px;">
      <span class="brand-mark">MA</span>Mensajería Anónima
    </div>

    <!-- Paso 1: solicitar enlace -->
    <div id="request-step">
      <h2 style="text-align:center; margin-bottom:4px;">Recuperar contraseña</h2>
      <p style="text-align:center; margin-bottom:24px;">Te enviaremos un enlace a tu correo.</p>

      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" autocomplete="email" placeholder="tu@correo.com" required />
          <div class="field-error" id="error-email"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="forgot-submit">Enviar enlace de recuperación</button>
      </form>

      <div id="forgot-sent" style="display:none; text-align:center;">
        <p>✓ Enlace enviado. Revisa tu bandeja de entrada.</p>
      </div>

      <p style="text-align:center; margin-top:20px; font-size:14px;">
        <a href="/login.html">Volver a iniciar sesión</a>
      </p>
    </div>

    <!-- Paso 2: nueva contraseña (llega desde el enlace del correo) -->
    <div id="reset-step" style="display:none;">
      <h2 style="text-align:center; margin-bottom:4px;">Nueva contraseña</h2>
      <p style="text-align:center; margin-bottom:24px;">Elige una nueva contraseña para tu cuenta.</p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new_password">Nueva contraseña</label>
          <input type="password" id="new_password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" required />
          <div class="field-error" id="error-new_password"></div>
        </div>
        <div class="field">
          <label for="confirm_password">Confirmar contraseña</label>
          <input type="password" id="confirm_password" autocomplete="new-password" placeholder="Repite la contraseña" required />
          <div class="field-error" id="error-confirm_password"></div>
        </div>
        <button type="submit" class="btn btn-primary" id="reset-submit">Actualizar contraseña</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>
<script>
  document.getElementById("forgot-form").addEventListener("submit", handleForgotPassword);
  document.getElementById("reset-form").addEventListener("submit", handleResetPassword);

  // Supabase redirige aquí con un evento PASSWORD_RECOVERY tras abrir el enlace del correo.
  supabaseClient.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") {
      document.getElementById("request-step").style.display = "none";
      document.getElementById("reset-step").style.display = "block";
    }
  });

  const params = new URLSearchParams(window.location.search);
  if (params.get("step") === "reset") {
    document.getElementById("request-step").style.display = "none";
    document.getElementById("reset-step").style.display = "block";
  }
</script>
</body>
</html>
